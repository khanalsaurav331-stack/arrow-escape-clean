name: arrow_escape
description: Arrow Escape - A casual grid puzzle game where you slide arrows out of the grid.
publish_to: 'none'
version: 1.3.3+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # State Management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # UI & Animations
  google_fonts: ^6.2.1

  confetti: ^0.7.0
  flutter_animate: ^4.5.0

  # Audio


  # Utils
  collection: ^1.18.0
  intl: ^0.19.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.0
  lucide_icons_flutter: ^3.1.14+2
  in_app_update: ^5.0.0

  # Firebase
  firebase_core: ^3.15.0
  firebase_crashlytics: ^4.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4 # 1. Added the official splash screen builder package

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/levels.bin
    - assets/level_chunks/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

# 2. Corrected Launcher Settings (Changes phone search icon border from beige to dark green)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  # 1. Keeps the solid dark green fill completely safe and flat to the outer edges
  adaptive_icon_background: "#0d140e" 
  # 2. Points to your master icon file as the floating floating foreground layer
  adaptive_icon_foreground: "assets/images/logo.png"

# 3. Added Splash Screen Engine (Overwrites the beige boot sequence permanently)
flutter_native_splash:
  color: "#0d140e" # Deep premium dark olive-green
  image: "assets/images/logo.png" # Your new 1024x1024 maze icon
  android_12:
    color: "#0d140e"
